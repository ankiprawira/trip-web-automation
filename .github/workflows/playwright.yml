name: trip-web-automation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chrome
    - name: Run Playwright tests
      id: playwright
      run: npx playwright test
      continue-on-error: true
    - name: Upload Playwright report for GitHub Pages
      if: >-
        always() && !cancelled() &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/
    - name: Fail job if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1

  deploy:
    needs: test
    if: >-
      always() && needs.test.result != 'cancelled' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy Playwright report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Add report link to workflow summary
      run: |
        echo "## Playwright report" >> "$GITHUB_STEP_SUMMARY"
        echo "Open the HTML report in your browser (no zip download):" >> "$GITHUB_STEP_SUMMARY"
        echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
